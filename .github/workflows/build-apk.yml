name: Build Agent APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Check Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "CHECKING ANDROID PROJECT"
          echo "======================================"

          echo "Repository:"
          ls -la

          test -f "settings.gradle"
          test -f "build.gradle"
          test -f "app/build.gradle"
          test -f "app/src/main/AndroidManifest.xml"

          echo ""
          echo "ANDROID PROJECT FOUND"
          echo "======================================"

      - name: Show Gemini source
