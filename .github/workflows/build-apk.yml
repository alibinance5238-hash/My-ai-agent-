name: Build Agent APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Extract source ZIP and locate Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "EXTRACTING AND LOCATING PROJECT"
          echo "======================================"

          rm -rf extracted-source
          mkdir -p extracted-source

          ZIP=""
          while IFS= read -r -d '' f; do
            ZIP="$f"
            break
          done < <(find . -maxdepth 2 -type f -iname '*.zip' -print0)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found in repository."
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          unzip -q -o "$ZIP" -d extracted-source

          SETTINGS="$(find extracted-source -type f -name 'settings.gradle' -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            find extracted-source -maxdepth 8 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

          find "$PROJECT_DIR" -maxdepth 8 -type f             \( -name 'settings.gradle' -o -name 'build.gradle' -o -name 'build.gradle.kts'             -o -name 'AndroidManifest.xml' -o -name '*.kt' -o -name '*.java' \) | sort

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Android project structure is OK."

      - name: Show agent source before build
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          GEMINI="$(find app/src/main/java -type f -name 'GeminiClient.kt' -print -quit || true)"

          if [ -n "$GEMINI" ]; then
            echo "----- GeminiClient.kt -----"
            nl -ba "$GEMINI" | sed -n '1,240p'
            echo "----- END GeminiClient.kt -----"
          else
            echo "WARNING: GeminiClient.kt was not found."
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -uo pipefail
          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING DEBUG APK"
          echo "======================================"

          if [ -x "./gradlew" ]; then
            BUILD_CMD=(./gradlew clean assembleDebug --no-daemon --stacktrace)
          else
            BUILD_CMD=(gradle clean assembleDebug --no-daemon --stacktrace)
          fi

          set +e
          "${BUILD_CMD[@]}" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo ""
            echo "======================================"
            echo "IMPORTANT BUILD ERRORS"
            echo "======================================"

            grep -E               '(^e: |error:|ERROR:|FAILURE:|What went wrong|Caused by:|Unresolved reference|Expecting |Type mismatch|Too many arguments)'               "$GITHUB_WORKSPACE/build.log" | tail -n 120 || true

            echo ""
            echo "======================================"
            echo "LAST 160 LOG LINES"
            echo "======================================"
            tail -n 160 "$GITHUB_WORKSPACE/build.log"

            exit "$BUILD_STATUS"
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          APK="$(find app/build/outputs -type f -name '*.apk' -print -quit || true)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find app/build -type f | sort || true
            exit 1
          fi

          echo "APK FOUND: $APK"
          echo "APK_PATH=$PROJECT_DIR/$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Debug-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Build-Log
          path: build.log
          if-no-files-found: ignore
          
