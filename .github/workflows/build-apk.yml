name: Build Agent APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "EXTRACTING ANDROID PROJECT"
          echo "======================================"

          ZIP="My-ai-agent-GITHUB-READY-FIXED.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP file not found: $ZIP"
            exit 1
          fi

          rm -rf android-project
          mkdir android-project

          unzip -o "$ZIP" -d android-project

          echo ""
          echo "Extracted files:"
          find android-project -maxdepth 4 -type f | sort

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "CHECKING ANDROID PROJECT"
          echo "======================================"

          cd android-project

          test -f "settings.gradle"
          test -f "build.gradle"
          test -f "app/build.gradle"
          test -f "app/src/main/AndroidManifest.xml"

          echo ""
          echo "All required Android files found."
          echo "Project structure is OK."

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING DEBUG APK"
          echo "======================================"

          cd android-project

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR APK"
          echo "======================================"

          find android-project/app/build/outputs \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find android-project/app/build/outputs \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Debug-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
