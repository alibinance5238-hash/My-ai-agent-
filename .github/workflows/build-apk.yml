name: Build Agent APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate AgentApp ZIP
        shell: bash
        run: |
          set -e

          echo "Searching repository for ZIP..."

          ZIP_FILE=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            echo ""
            echo "Repository files:"
            find . -maxdepth 5 -type f -not -path "./.git/*" | sort
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract AgentApp
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -q -o "$ZIP_FILE" -d extracted

          echo ""
          echo "========== EXTRACTED STRUCTURE =========="

          find extracted -maxdepth 8 -type f \
            -not -path "*/.git/*" \
            | sort

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          echo ""
          echo "========== SEARCHING GRADLE PROJECT =========="

          PROJECT_DIR=""

          # Look for settings.gradle / settings.gradle.kts
          while IFS= read -r SETTINGS; do
            DIR="$(dirname "$SETTINGS")"

            echo "Checking:"
            echo "$DIR"

            if [ -f "$DIR/build.gradle" ] || \
               [ -f "$DIR/build.gradle.kts" ]; then

              PROJECT_DIR="$DIR"
              break
            fi
          done < <(
            find extracted -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              | sort
          )

          # If settings.gradle is absent, find an Android build.gradle
          if [ -z "$PROJECT_DIR" ]; then

            while IFS= read -r BUILD_FILE; do

              DIR="$(dirname "$BUILD_FILE")"

              if [ -f "$DIR/gradlew" ] || \
                 [ -f "$DIR/settings.gradle" ] || \
                 [ -f "$DIR/settings.gradle.kts" ]; then

                PROJECT_DIR="$DIR"
                break
              fi

            done < <(
              find extracted -type f \
                \( -name "build.gradle" -o -name "build.gradle.kts" \) \
                | sort
            )

          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo ""
            echo "ERROR: Android Gradle project NOT FOUND."
            echo ""
            echo "The extracted ZIP contains:"
            find extracted -maxdepth 10 -type f | sort
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "ANDROID PROJECT FOUND:"
          echo "$PROJECT_DIR"
          echo "======================================"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify project
        shell: bash
        run: |
          set -e

          echo "Project:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Files:"
          ls -la "$PROJECT_DIR"

          echo ""
          echo "Gradle configuration:"
          find "$PROJECT_DIR" -maxdepth 3 -type f \
            \( \
              -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "gradlew" \
              -o -name "gradle-wrapper.properties" \
            \) \
            -print

      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "STARTING ANDROID BUILD"
          echo "======================================"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "Gradle wrapper not found."
            echo "Installing Gradle 8.7..."

            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q gradle-8.7-bin.zip
            export PATH="$PWD/gradle-8.7/bin:$PATH"

            gradle --version
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Find APK
        shell: bash
        run: |
          echo "======================================"
          echo "APK FILES"
          echo "======================================"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Debug-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
