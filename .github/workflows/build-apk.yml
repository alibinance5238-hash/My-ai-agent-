name: Build Agent APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Extract source ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "EXTRACTING SOURCE ZIP"
          echo "======================================"

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            ls -la
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"

          rm -rf android-project
          mkdir -p android-project

          unzip -o "$ZIP_FILE" -d android-project

          echo ""
          echo "Extraction completed."

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "LOCATING ANDROID PROJECT"
          echo "======================================"

          SETTINGS_FILE=$(find android-project -type f -name "settings.gradle" -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found."
            echo ""
            echo "Files found:"
            find android-project -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "BUILD_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VERIFYING ANDROID PROJECT"
          echo "======================================"

          echo "Build directory:"
          echo "$BUILD_DIR"

          test -f "$BUILD_DIR/settings.gradle"
          test -f "$BUILD_DIR/build.gradle"
          test -f "$BUILD_DIR/app/build.gradle"
          test -f "$BUILD_DIR/app/src/main/AndroidManifest.xml"

          echo ""
          echo "ANDROID PROJECT VERIFIED."

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING DEBUG APK"
          echo "======================================"

          cd "$BUILD_DIR"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR APK"
          echo "======================================"

          APK_FILE=$(find "$BUILD_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Debug-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
