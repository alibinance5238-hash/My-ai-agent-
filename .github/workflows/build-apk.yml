name: Build Agent APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract AgentApp ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "FINDING ZIP"
          echo "======================================"

          ZIP_FILE=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          echo "ZIP:"
          echo "$ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo ""
          echo "======================================"
          echo "EXTRACTED CONTENT"
          echo "======================================"

          find extracted -maxdepth 8 -type f | sort

      - name: Locate AgentApp folder
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "LOCATING AGENTAPP"
          echo "======================================"

          AGENT_DIR=$(find extracted -type d -name "AgentApp" | head -n 1)

          if [ -z "$AGENT_DIR" ]; then
            echo "AgentApp folder not found."

            echo ""
            echo "Folders found:"
            find extracted -type d | sort

            exit 1
          fi

          echo "AgentApp found at:"
          echo "$AGENT_DIR"

          echo "PROJECT_DIR=$AGENT_DIR" >> "$GITHUB_ENV"

      - name: Show AgentApp structure
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "AGENTAPP STRUCTURE"
          echo "======================================"

          ls -la "$PROJECT_DIR"

          echo ""
          echo "Important files:"
          find "$PROJECT_DIR" -maxdepth 4 -type f \
            \( \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "gradlew" \
              -o -name "AndroidManifest.xml" \
            \) \
            -print

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            echo "Gradle wrapper found."
            chmod +x "$PROJECT_DIR/gradlew"
          else
            echo "Gradle wrapper not found."
            echo "Installing Gradle 8.7..."

            cd "$PROJECT_DIR"

            wget -q \
              https://services.gradle.org/distributions/gradle-8.7-bin.zip

            unzip -q gradle-8.7-bin.zip

            echo "GRADLE_HOME=$PWD/gradle-8.7" >> "$GITHUB_ENV"
            echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"
          fi

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "BUILDING APK"
          echo "======================================"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Find APK
        shell: bash
        run: |
          echo "======================================"
          echo "SEARCHING FOR APK"
          echo "======================================"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Debug-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/*.apk
          if-no-files-found: error
