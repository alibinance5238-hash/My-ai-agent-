name: Build Agent APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "LOCATING ANDROID PROJECT"
          echo "======================================"

          if [ -f "settings.gradle" ] && [ -f "app/build.gradle" ]; then
            PROJECT_DIR="$PWD"
            echo "Project is already at repository root."
          else
            rm -rf extracted-source
            mkdir -p extracted-source

            ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Android project not found."
              echo "Expected settings.gradle + app/build.gradle at root, or one source ZIP."
              find . -maxdepth 4 -type f | sort
              exit 1
            fi

            echo "Extracting: $ZIP_FILE"
            unzip -q -o "$ZIP_FILE" -d extracted-source

            SETTINGS_FILE="$(find extracted-source -type f -name 'settings.gradle' -print -quit)"

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: settings.gradle not found after extraction."
              find extracted-source -maxdepth 8 -type f | sort
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "VERIFYING PROJECT"
          echo "======================================"

          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/user/agentapp/GeminiClient.kt
          test -f app/src/main/java/com/user/agentapp/CommandExecutor.kt
          test -f app/src/main/java/com/user/agentapp/VoiceConversationService.kt

          echo "All required files found."

      - name: Build Debug APK
        shell: bash
        run: |
          set +e
          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING DEBUG APK"
          echo "======================================"

          if [ -x "./gradlew" ]; then
            ./gradlew clean assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
            status=${PIPESTATUS[0]}
          else
            gradle clean assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
            status=${PIPESTATUS[0]}
          fi

          if [ "$status" -ne 0 ]; then
            echo ""
            echo "======================================"
            echo "COMPILATION ERRORS"
            echo "======================================"
            grep -E '(^e: |error:|Unresolved reference|Expecting |Type mismatch|Const .+initializer)' "$GITHUB_WORKSPACE/build.log" | tail -n 120 || true
            echo ""
            echo "======================================"
            echo "LAST BUILD LOG"
            echo "======================================"
            tail -n 160 "$GITHUB_WORKSPACE/build.log"
            exit "$status"
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs" -type f -name '*.apk' -print -quit || true)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find "$PROJECT_DIR/app/build" -type f | sort || true
            exit 1
          fi

          echo "APK FOUND: $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Debug-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Build-Log
          path: build.log
          if-no-files-found: ignore
          
