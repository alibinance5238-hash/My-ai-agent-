name: Build Agent APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "EXTRACTING ANDROID PROJECT"
          echo "======================================"

          ZIP="My-ai-agent-GITHUB-READY-FIXED-V2.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP NOT FOUND"
            ls -la
            exit 1
          fi

          rm -rf android-project
          mkdir android-project

          unzip -o "$ZIP" -d android-project

          echo ""
          echo "Android project:"
          find android-project -maxdepth 4 -type f | sort

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VERIFYING PROJECT"
          echo "======================================"

          test -f android-project/settings.gradle
          test -f android-project/build.gradle
          test -f android-project/app/build.gradle
          test -f android-project/app/src/main/AndroidManifest.xml

          echo "Android project OK."

      - name: Force fix GeminiClient
        shell: bash
        run: |
          set -e

          FILE="android-project/app/src/main/java/com/user/agentapp/GeminiClient.kt"

          echo "======================================"
          echo "CHECKING GEMINICLIENT.KT"
          echo "======================================"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: GeminiClient.kt not found."
            exit 1
          fi

          echo "Current lines 66-75:"
          nl -ba "$FILE" | sed -n '66,75p'

          python3 - "$FILE" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          old = '''                    put(JSONObject().put("inline_data", JSONObject()
                        .put("mime_type", "image/jpeg")
                        .put("data", android.util.Base64.encodeToString(screenJpeg, android.util.Base64.NO_WRAP))))
'''

          new = '''                    val encodedImage = android.util.Base64.encodeToString(
                        screenJpeg,
                        android.util.Base64.NO_WRAP
                    )

                    put(
                        JSONObject().put(
                            "inline_data",
                            JSONObject()
                                .put("mime_type", "image/jpeg")
                                .put("data", encodedImage)
                        )
                    )
'''

          if old in text:
              text = text.replace(old, new)
          else:
              print("Original block not found.")
              print("Checking whether valid replacement is already present...")

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

          echo ""
          echo "After fix, lines 66-82:"
          nl -ba "$FILE" | sed -n '66,82p'

      - name: Build Debug APK
        working-directory: android-project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING DEBUG APK"
          echo "======================================"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR APK"
          echo "======================================"

          find android-project/app/build/outputs \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find android-project/app/build/outputs \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK WAS NOT GENERATED"
            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Debug-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
