name: Build Agent APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "LOCATING ANDROID PROJECT"
          echo "======================================"

          if [ -f "settings.gradle" ] && [ -f "app/build.gradle" ]; then
            PROJECT_DIR="$PWD"
            echo "Android project is already at repository root."
          else
            rm -rf extracted-source
            mkdir -p extracted-source

            ZIP=""
            for candidate in *SOURCE*.zip *source*.zip *.zip; do
              if [ -f "$candidate" ]; then
                ZIP="$candidate"
                break
              fi
            done

            if [ -z "$ZIP" ]; then
              echo "ERROR: No Android project found and no ZIP was present."
              find . -maxdepth 3 -type f | sort
              exit 1
            fi

            echo "Extracting: $ZIP"
            unzip -q -o "$ZIP" -d extracted-source

            PROJECT_SETTINGS="$(find extracted-source -type f -name 'settings.gradle' -print -quit)"
            if [ -z "$PROJECT_SETTINGS" ]; then
              echo "ERROR: settings.gradle was not found after extraction."
              find extracted-source -type f | sort
              exit 1
            fi

            PROJECT_DIR="$(dirname "$PROJECT_SETTINGS")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"
          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 4 -type f | sort

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          echo "======================================"
          echo "VERIFYING ANDROID PROJECT"
          echo "======================================"

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/user/agentapp/GeminiClient.kt
          test -f app/src/main/java/com/user/agentapp/VoiceConversationService.kt

          echo "Android project structure OK."

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING DEBUG APK"
          echo "======================================"

          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          echo "======================================"
          echo "SEARCHING FOR APK"
          echo "======================================"

          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find app/build -type f | sort || true
            exit 1
          fi

          echo "APK FOUND: $APK"
          echo "APK_PATH=$PROJECT_DIR/$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Agent-Debug-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          
